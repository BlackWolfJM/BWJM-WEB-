<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BWJM Studio · Interfaz</title>
    <link rel="stylesheet" href="./theme.css" />
    <link rel="stylesheet" href="./shell.css" />
    <script type="module" src="./shell.js"></script>
  </head>
  <body>
    <div class="bwjm-app-container mode-split theme-linear" id="app">
      <header class="bwjm-studio-header">
        <div class="bwjm-studio-brand">
          <span class="bwjm-studio-mark" aria-hidden="true">⚛</span>
          <span class="bwjm-studio-name">BWJM <strong>Studio</strong></span>
          <span class="bwjm-studio-subtitle">Editor científico</span>
        </div>
        <div class="shell-search"><input type="search" placeholder="Buscar en el documento" aria-label="Buscar en el documento" /></div>
        <div class="bwjm-studio-header-meta">
          <span class="bwjm-studio-active-name" id="active-name">Sin título.bwjm</span>
          <span class="bwjm-studio-diagnostics">✓ 0 errores</span>
        </div>
      </header>

      <nav class="bwjm-document-tabs" aria-label="Documentos abiertos">
        <button class="bwjm-document-sidebar-toggle is-active" type="button" id="toggle-sidebar" aria-label="Mostrar u ocultar panel del documento">☷</button>
        <div class="bwjm-document-tab-list" id="document-tabs" role="tablist" aria-label="Archivos BWJM"></div>
        <button class="bwjm-document-new" type="button" id="new-tab" aria-label="Nuevo documento">＋</button>
      </nav>

      <section class="bwjm-ribbon" aria-label="Cinta de herramientas BWJM">
        <div class="bwjm-ribbon-tabs">
          <div class="bwjm-ribbon-tablist" id="ribbon-tabs" role="tablist" aria-label="Categorías de herramientas"></div>
          <button class="bwjm-ribbon-collapse" id="collapse-ribbon" type="button" aria-expanded="true">⌃ <span>Ocultar</span></button>
        </div>
        <div class="bwjm-ribbon-content" id="ribbon-content" role="tabpanel"></div>
      </section>

      <div class="bwjm-workspace-layout">
        <aside class="bwjm-sidebar-left bwjm-document-sidebar bwjm-sidebar-mode-expanded" id="sidebar" aria-label="Panel del documento">
          <div class="bwjm-document-sidebar-header">
            <div class="bwjm-document-sidebar-title"><strong>Documento</strong></div>
            <div class="bwjm-document-sidebar-actions">
              <button class="bwjm-sidebar-icon-button" id="collapse-sidebar" type="button" aria-label="Contraer panel">☷</button>
              <button class="bwjm-sidebar-icon-button" id="close-sidebar" type="button" aria-label="Ocultar panel">×</button>
            </div>
          </div>
          <div class="bwjm-document-sidebar-tabs" id="sidebar-tabs" role="tablist" aria-label="Herramientas del documento"></div>
          <div class="bwjm-sidebar-content bwjm-document-sidebar-content" id="sidebar-content" role="tabpanel"></div>
        </aside>

        <main class="bwjm-main-split" id="bwjm-workspace-active">
          <section class="bwjm-editor-panel" id="bwjm-editor-panel">
            <div class="bwjm-panel-toolbar">
              <span class="bwjm-panel-title">Editor de Código .bwjm</span>
              <span class="bwjm-char-count">0 caracteres</span>
            </div>
            <textarea class="bwjm-code-textarea" id="editor" aria-label="Editor del documento" spellcheck="false"></textarea>
          </section>
          <section class="bwjm-preview-panel" id="bwjm-reader-panel">
            <div class="bwjm-scroll-container"><div class="shell-page" id="reader-content"></div></div>
          </section>
        </main>
      </div>
      <div class="shell-status" id="status" role="status" aria-live="polite"></div>
    </div>
  </body>
</html>
